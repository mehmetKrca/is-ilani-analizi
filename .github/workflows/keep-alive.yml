# Streamlit Community Cloud uygulamasını uyanık tutar.
# Token veya secret gerektirmez; Playwright ile uygulamayı gerçek bir tarayıcıda açar.
name: Uygulamayı uyanık tut

on:
  schedule:
    - cron: "17 */6 * * *"   # her 6 saatte bir (UTC 00:17, 06:17, 12:17, 18:17)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  uyandir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright ve Chromium kur
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium

      - name: Uygulamayı aç ve yüklendiğini doğrula (en fazla ~3 dk)
        env:
          APP_URL: https://is-piyasasi-llm.streamlit.app/
          BEKLEME_SN: "180"
          EKRAN_DOSYASI: keep_alive_hata.png
        run: python scripts/keep_alive.py

      - name: Başarısızsa ekran görüntüsünü sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-ekran
          path: keep_alive_hata.png
          if-no-files-found: ignore
          retention-days: 7
